name: Deploy to GitHub Pages

# Builds the Next.js site as a static export and publishes it to
# GitHub Pages. Runs on every push to main.
# Live URL: https://mdsonetmia04-cmyk.github.io/sonet-website/
# When a custom domain is bought: add it in the repo's Pages settings
# (it creates a CNAME file automatically) and update NEXT_PUBLIC_SITE_URL
# below to the domain — and remove the basePath by unsetting GITHUB_PAGES.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://mdsonetmia04-cmyk.github.io/sonet-website
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Disable Jekyll (so _next assets are served)
        run: touch out/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
